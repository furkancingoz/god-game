<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanrı Oyunu — Divine God Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-gold: #ffd700;
      --glass-bg: rgba(16, 20, 32, 0.65);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #090d16;
      width: 100%;
      height: 100%;
      user-select: none;
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Top Dashboard */
    #hud-header {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 100;
    }

    .hud-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .stat-icon {
      font-size: 22px;
    }

    .stat-info {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--primary-gold);
      font-weight: 700;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    /* Level Progress */
    .level-card {
      min-width: 180px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffaa00, #ffd700);
      transition: width 0.3s ease;
    }

    /* Toast Notification Banner */
    #toast-banner {
      position: fixed;
      top: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--primary-gold);
      color: #fff8e7;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(255, 215, 0, 0.2);
    }

    #toast-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Bottom Divine Action Dock */
    #hud-dock {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 8px 12px;
      display: flex;
      gap: 10px;
      z-index: 100;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .dock-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 10px 16px;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-4px);
    }

    .dock-btn.active {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.25), rgba(255, 170, 0, 0.15));
      border-color: var(--primary-gold);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .btn-icon {
      font-size: 22px;
    }

    .btn-name {
      font-size: 12px;
      font-weight: 600;
    }

    .btn-key {
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 5px;
      border-radius: 4px;
    }

    /* Controls overlay hint */
    #controls-hint {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 12px;
      color: var(--text-muted);
      z-index: 90;
      line-height: 1.5;
    }

    #controls-hint strong {
      color: var(--primary-gold);
    }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="controls-hint">
    <strong>Kamera:</strong> Sol Tık Sürükle (Döndür) | Sağ Tık (Pan)<br>
    <strong>Güçler:</strong> 1-5 Kısayolları veya Alt Menü
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
