<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanrı Oyunu</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #0a0a12; width: 100%; height: 100%; user-select: none; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      color: #fff8e7;
      font-family: Georgia, serif;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      font-size: 18px;
      pointer-events: none;
      z-index: 10;
      background: rgba(10, 10, 18, 0.4);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(4px);
    }
    .hud-stat {
      margin-bottom: 4px;
    }
    #controls-hint {
      position: fixed;
      bottom: 16px;
      left: 16px;
      color: rgba(255, 248, 231, 0.7);
      font-family: system-ui, sans-serif;
      font-size: 13px;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="controls-hint">
    Sol tık: Arazi yükselt / Döndür | Shift+Tık: Alçalt | R tuşu: Yağmur mucizesi
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
