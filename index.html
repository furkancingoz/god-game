<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanrı Oyunu — Divine God Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-gold: #ffd700;
      --glass-bg: rgba(16, 20, 32, 0.75);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #090d16;
      width: 100%;
      height: 100%;
      user-select: none;
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Top Dashboard */
    #hud-header {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 100;
    }

    .hud-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .res-card {
      display: flex;
      gap: 14px;
      font-size: 14px;
      font-weight: 600;
    }

    .res-item span {
      color: var(--primary-gold);
    }

    .stat-icon {
      font-size: 20px;
    }

    .stat-info {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--primary-gold);
      font-weight: 700;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    /* Level Progress */
    .level-card {
      min-width: 160px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 3px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffaa00, #ffd700);
      transition: width 0.3s ease;
    }

    /* Clock & Speed */
    .clock-card {
      display: flex;
      gap: 8px;
    }

    .clock-val {
      font-weight: 700;
      font-size: 14px;
      color: #7ac1ec;
    }

    .time-btns {
      display: flex;
      gap: 4px;
    }

    .time-btns button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      padding: 3px 6px;
      font-size: 11px;
    }

    .time-btns button.active {
      background: var(--primary-gold);
      color: #000;
    }

    .spellbook-btn {
      cursor: pointer;
      font-size: 18px;
      border-color: var(--primary-gold);
      transition: transform 0.2s;
    }

    .spellbook-btn:hover {
      transform: scale(1.1);
    }

    /* Toast Notification Banner */
    #toast-banner {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--primary-gold);
      color: #fff8e7;
      padding: 8px 22px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(255, 215, 0, 0.2);
    }

    #toast-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Bottom Divine Action Dock */
    #hud-dock {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 6px 10px;
      display: flex;
      gap: 8px;
      z-index: 100;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .dock-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 8px 14px;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-3px);
    }

    .dock-btn.active {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.25), rgba(255, 170, 0, 0.15));
      border-color: var(--primary-gold);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .btn-icon {
      font-size: 20px;
    }

    .btn-name {
      font-size: 11px;
      font-weight: 600;
    }

    .btn-key {
      position: absolute;
      top: 3px;
      right: 5px;
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.3);
      padding: 1px 4px;
      border-radius: 3px;
    }

    /* Follower Inspector Card */
    #follower-inspector {
      position: fixed;
      top: 85px;
      right: 20px;
      flex-direction: column;
      gap: 8px;
      min-width: 200px;
      z-index: 100;
    }

    .inspector-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .follower-name {
      font-weight: 700;
      font-size: 16px;
      color: var(--primary-gold);
    }

    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    .follower-role {
      font-size: 12px;
      color: var(--text-muted);
    }

    .stat-bar-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-bar-group label {
      font-size: 10px;
      color: var(--text-muted);
    }

    .mini-progress-bg {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .mini-progress-fill {
      height: 100%;
      background: #3b82f6;
    }

    .prophet-btn {
      margin-top: 6px;
      width: 100%;
      background: linear-gradient(135deg, #eab308, #ca8a04);
      border: none;
      color: #000;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    /* Spellbook Modal */
    #spellbook-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
    }

    .modal-content {
      position: relative;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      width: 500px;
      max-width: 90%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      margin: 0;
      font-family: 'Cinzel', serif;
      font-size: 18px;
      color: var(--primary-gold);
    }

    .modal-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }

    .spell-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .spell-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    .spell-icon {
      font-size: 24px;
    }

    .spell-info h3 {
      margin: 0;
      font-size: 14px;
      color: var(--primary-gold);
    }

    .spell-info p {
      margin: 4px 0 0 0;
      font-size: 11px;
      color: var(--text-muted);
    }

    .spell-status {
      align-self: flex-end;
      font-size: 10px;
      font-weight: 700;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Controls overlay hint */
    #controls-hint {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 11px;
      color: var(--text-muted);
      z-index: 90;
      line-height: 1.5;
    }

    #controls-hint strong {
      color: var(--primary-gold);
    }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="controls-hint">
    <strong>Kamera:</strong> Sol Tık Sürükle (Döndür) | Sağ Tık (Pan)<br>
    <strong>Güçler:</strong> 1-6 Kısayolları veya Alt Menü
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
